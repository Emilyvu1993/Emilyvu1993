name: Build desktop app

# Run it from the Actions tab ("Run workflow") or push a tag like v0.1.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows installer (single .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Python dependencies (PyInstaller, reportlab for the smoke test)
        run: python -m pip install -r sidecar/requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Freeze the Python sidecar
        working-directory: app
        run: npm run sidecar:build
      - name: Smoke-test the frozen sidecar (fails the build if it is broken)
        env:
          PYTHONIOENCODING: utf-8
        run: python sidecar/smoke_frozen.py
      - name: Build the installer (one NSIS setup .exe, per-user install)
        working-directory: app
        run: npx tauri build --bundles nsis --config src-tauri/tauri.release.conf.json

      - name: Locate the installer
        id: installer
        shell: pwsh
        run: |
          $f = @(Get-ChildItem app/src-tauri/target/release/bundle/nsis -Filter *.exe)
          if ($f.Count -ne 1) { throw "expected exactly one installer .exe, found $($f.Count)" }
          "{0}  {1:N1} MB  sha256={2}" -f $f[0].Name, ($f[0].Length / 1MB), (Get-FileHash $f[0].FullName).Hash
          "path=$($f[0].FullName)" >> $env:GITHUB_OUTPUT

      # ---- verify the installer itself, as a user would use it ----
      - name: Install silently (current user, no administrator rights)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "${{ steps.installer.outputs.path }}" -ArgumentList "/S" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with code $($p.ExitCode)" }
          $exe = Get-ChildItem -Path $env:LOCALAPPDATA -Recurse -Depth 2 -Filter "pdf2md-workspace.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Get-ChildItem $env:LOCALAPPDATA | Select-Object -ExpandProperty Name; throw "installed app not found under %LOCALAPPDATA%" }
          $dir = $exe.DirectoryName
          foreach ($n in "pdf2md-workspace.exe", "pdf2md.exe", "uninstall.exe") {
            if (-not (Test-Path (Join-Path $dir $n))) { Get-ChildItem $dir | Select-Object Name, Length; throw "missing $n in $dir" }
          }
          Get-ChildItem $dir | Select-Object Name, Length
          "INSTALL_DIR=$dir" >> $env:GITHUB_ENV
      - name: The installed app is a GUI program (no console window)
        run: python app/scripts/pe_subsystem.py "$env:INSTALL_DIR\pdf2md-workspace.exe" gui
      - name: Smoke-test the INSTALLED sidecar
        env:
          PYTHONIOENCODING: utf-8
        run: python sidecar/smoke_frozen.py "$env:INSTALL_DIR\pdf2md.exe"
      - name: Launch the installed app and take a screenshot
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "$env:INSTALL_DIR\pdf2md-workspace.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($app.HasExited) { throw "app exited early with code $($app.ExitCode)" }
          $app.Refresh()
          "main window title: '$($app.MainWindowTitle)'"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save("$env:RUNNER_TEMP\app-window.png")
          Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($env:INSTALL_DIR) } | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Upload the screenshot (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-window
          path: ${{ runner.temp }}/app-window.png
          if-no-files-found: warn
      - name: Uninstall silently
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($env:INSTALL_DIR) } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Process -FilePath "$env:INSTALL_DIR\uninstall.exe" -ArgumentList "/S" -Wait | Out-Null
          for ($i = 0; $i -lt 30 -and (Test-Path "$env:INSTALL_DIR\pdf2md-workspace.exe"); $i++) { Start-Sleep -Seconds 1 }   # the uninstaller finishes in a child process
          if (Test-Path "$env:INSTALL_DIR\pdf2md-workspace.exe") { throw "uninstall left the app behind" }
          "uninstalled cleanly"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
