name: Build desktop app

# Run it from the Actions tab ("Run workflow") or push a tag like v0.1.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Linux libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Python environment (the Rust tests start the sidecar from ./.venv)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r sidecar/requirements-dev.txt
      - name: Python tests
        working-directory: sidecar
        run: ../.venv/bin/python -m pytest -q
      - name: Frontend checks
        working-directory: app
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test

  build-windows:
    name: Windows installers
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Python dependencies (PyInstaller, reportlab for the smoke test)
        run: python -m pip install -r sidecar/requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Freeze the Python sidecar
        working-directory: app
        run: npm run sidecar:build
      - name: Smoke-test the frozen sidecar (fails the build if it is broken)
        env:
          PYTHONIOENCODING: utf-8
        run: python sidecar/smoke_frozen.py
      - name: Build the installers (MSI + NSIS)
        working-directory: app
        run: npx tauri build --config src-tauri/tauri.release.conf.json
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
